name: Module scope

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-scope:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read approved scope labels
        shell: bash
        run: |
          scopes=$(jq -r '[.pull_request.labels[].name | select(startswith("scope:")) | sub("^scope:"; "")] | join(",")' "$GITHUB_EVENT_PATH")
          if [ -z "$scopes" ]; then
            echo "Add at least one user-approved scope:<name> label to this pull request."
            exit 1
          fi
          echo "MODULE_SCOPES=$scopes" >> "$GITHUB_ENV"

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Check changed paths
        run: node scripts/check-module-scope.mjs --scopes="$MODULE_SCOPES" --base="origin/${{ github.base_ref }}"

