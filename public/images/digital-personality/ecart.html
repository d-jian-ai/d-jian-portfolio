<script>
try {
  const locale = localStorage.getItem('creer-locale');
  const active = locale === 'en' || locale === 'fr' || locale === 'zh' ? locale : 'zh';
  document.documentElement.lang = active === 'zh' ? 'zh-CN' : active;
  document.documentElement.dataset.lang = active;
} catch (_) {
  document.documentElement.dataset.lang = 'zh';
}
</script>
